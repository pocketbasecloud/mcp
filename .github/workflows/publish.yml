# Publishes server.json to the MCP Registry as com.pocketbasecloud/mcp when a version tag is pushed:
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# The tag must match the manifests' version (the Registry never takes the same version twice, so a mismatch would
# burn one). Signs in by DNS with the Ed25519 key in the mcp-registry environment's MCP_PRIVATE_KEY secret; see
# docs/publishing.md.
name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: mcp-registry
  cancel-in-progress: false

env:
  MCP_PUBLISHER_VERSION: "1.8.1"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # MCP_PRIVATE_KEY is a secret of this environment, which only v* tags may deploy to.
    environment: mcp-registry
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the manifests
        run: |
          npm test
          npm run validate

      - name: Check the tag matches the version
        run: |
          version="$(node -p "require('./server.json').version")"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match server.json version ${version}."
            exit 1
          fi

      - name: Install mcp-publisher ${{ env.MCP_PUBLISHER_VERSION }}
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}"
          curl -fsSLO "${base}/mcp-publisher_linux_amd64.tar.gz"
          curl -fsSLO "${base}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep ' mcp-publisher_linux_amd64.tar.gz$' "registry_${MCP_PUBLISHER_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher

      - name: Sign in to the MCP Registry
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_PRIVATE_KEY" ]; then
            echo "::error::The MCP_PRIVATE_KEY secret is not set."
            exit 1
          fi
          ./mcp-publisher login dns --domain pocketbasecloud.com --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish
